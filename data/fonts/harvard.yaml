hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "Harvard"
    vendor: "custom"
    version: "1.0.0"
    license: "OFL"
    style: "serif"
    description: "Classical Garamond-style serif pairing for formal institutional sites"

  families:
    heading: "EB Garamond"
    body: "Source Serif 4"
    code: "Source Code Pro"

  weights:
    heading: [400, 500, 600]
    body: [400, 600]
    code: [400]

  leading:
    heading: 1.2
    body: 1.75
    code: 1.5

  tracking:
    heading: "0.01em"
    body: "0"

  variable:
    heading: true
    body: true
    code: false
